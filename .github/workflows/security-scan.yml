name: Security Vulnerability Scan

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday midnight
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: NPM Audit & License Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run NPM Audit (High & Critical)
        run: npm audit --audit-level=high

      - name: License Compliance Check (ALLOW / REVIEW / DENY Policy)
        run: |
          npx -y license-checker --production --excludePrivatePackages --json > license-report.json
          echo "=== License Compliance Check (Production Dependencies) ==="
          node -e "
            const report = JSON.parse(require('fs').readFileSync('license-report.json', 'utf8'));
            const DENY_PATTERNS = [/\bAGPL\b/i, /\bGPL-1/i, /\bGPL-2/i, /\bGPL-3/i];
            const REVIEW_PATTERNS = [/\bLGPL\b/i, /\bMPL\b/i, /\bEPL\b/i];
            const denied = [];
            const review = [];

            for (const [pkg, info] of Object.entries(report)) {
              const lic = String(info.licenses || '');
              if (DENY_PATTERNS.some(p => p.test(lic))) {
                denied.push(pkg + ' (' + lic + ')');
              } else if (REVIEW_PATTERNS.some(p => p.test(lic))) {
                review.push(pkg + ' (' + lic + ')');
              }
            }

            if (review.length > 0) {
              console.log('ℹ️ Dependencies requiring periodic review:');
              review.forEach(r => console.log('  - ' + r));
            }

            if (denied.length > 0) {
              console.error('❌ DENIED copyleft licenses found in production dependencies:');
              denied.forEach(d => console.error('  - ' + d));
              process.exit(1);
            }

            const count = Object.keys(report).length;
            console.log('✓ License check passed: ' + count + ' production dependencies scanned, 0 DENIED licenses.');
          "

      - name: Upload License Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          retention-days: 30
          path: license-report.json
